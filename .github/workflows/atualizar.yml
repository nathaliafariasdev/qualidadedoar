name: Atualizacao Horaria Sampa Ar

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências e rodar script
        run: |
          pip install pandas numpy requests geobr geopandas scipy folium branca shapely pyproj
          python atualizar_previsao.py

      - name: Salvar novos dados no repositório
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add estacoes_pred.json mapa_sp.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos arquivos gerados."
          else
            git commit -m "chore: atualizacao horaria automatica"
            git push
          fi